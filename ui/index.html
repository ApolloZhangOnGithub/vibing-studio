<script>
  // 主题：手动选过的优先，否则跟随系统；首帧前定下，浅色不会先闪一下黑底
  if (localStorage.getItem("tsu-theme") ? localStorage.getItem("tsu-theme") === "light" : matchMedia("(prefers-color-scheme: light)").matches)
    document.documentElement.classList.add("light");
</script>
<!-- iOS（手机）：宽度 ≤ 600 或网址带 ?ios=1 时根元素加 .ios（首帧前定下，不会先闪一下 macOS 的桌面）；外壳与终端在 ios/ 里 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="sim/ios/shell.css">
<link rel="stylesheet" href="sim/ios/term.css">
<script>
  (function () {
    var q = /[?&]ios=([01])(&|$)/.exec(location.search), r = document.documentElement;
    if (!(q ? q[1] === "1" : matchMedia("(max-width: 600px)").matches)) return;
    r.classList.add("ios");
    // 真的手机上状态栏、Home 指示条是系统画的；在电脑上看（?ios=1、窄窗口）才自己画一份
    if (q || !(/iPhone|iPad|iPod|Android/.test(navigator.userAgent) && navigator.maxTouchPoints > 0)) r.classList.add("ios-sim");
    // 输入框聚焦时不放大页面（iOS 会把小于 16px 的输入框放大）
    var vp = document.querySelector('meta[name="viewport"]');
    if (vp) vp.content = "width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover";
  })();
</script>
<!-- /iOS -->
