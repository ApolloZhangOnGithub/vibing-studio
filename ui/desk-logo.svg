<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- macOS Simulator 的图标（手画）：一台小桌面——墙纸、顶上的菜单栏、中间一个窗口（红黄绿三个点）、底下的程序坞 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a7bfd"/>
      <stop offset="0.55" stop-color="#7b5cff"/>
      <stop offset="1" stop-color="#e05fb5"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1f8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1b1147" flood-opacity="0.35"/>
    </filter>
    <clipPath id="sq"><rect width="1024" height="1024" rx="230"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <!-- 墙纸：蓝紫渐变，两道起伏的山 -->
    <rect width="1024" height="1024" fill="url(#sky)"/>
    <path d="M0 650 C 160 560 300 600 430 660 S 720 760 1024 610 L 1024 1024 L 0 1024 Z" fill="url(#hill)"/>
    <path d="M0 790 C 210 700 380 760 560 800 S 860 830 1024 760 L 1024 1024 L 0 1024 Z" fill="#ffffff" fill-opacity="0.12"/>
    <!-- 菜单栏 -->
    <rect x="0" y="0" width="1024" height="92" fill="#ffffff" fill-opacity="0.42"/>
    <circle cx="172" cy="46" r="16" fill="#1d1d2b" fill-opacity="0.78"/>
    <rect x="214" y="37" width="92" height="18" rx="9" fill="#1d1d2b" fill-opacity="0.62"/>
    <rect x="330" y="37" width="64" height="18" rx="9" fill="#1d1d2b" fill-opacity="0.38"/>
    <rect x="418" y="37" width="78" height="18" rx="9" fill="#1d1d2b" fill-opacity="0.38"/>
    <rect x="746" y="37" width="104" height="18" rx="9" fill="#1d1d2b" fill-opacity="0.5"/>
    <!-- 窗口 -->
    <g filter="url(#shadow)">
      <rect x="196" y="214" width="632" height="436" rx="44" fill="url(#win)"/>
    </g>
    <path d="M196 258 a44 44 0 0 1 44 -44 h544 a44 44 0 0 1 44 44 v42 h-632 z" fill="#e3e7f1"/>
    <circle cx="256" cy="258" r="17" fill="#ff5f57"/>
    <circle cx="308" cy="258" r="17" fill="#febc2e"/>
    <circle cx="360" cy="258" r="17" fill="#28c840"/>
    <!-- 窗口里：一个提示符和几行字 -->
    <path d="M262 372 l46 36 l-46 36" fill="none" stroke="#3a7bfd" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="336" y="432" width="96" height="22" rx="11" fill="#3a7bfd" fill-opacity="0.9"/>
    <rect x="262" y="496" width="420" height="22" rx="11" fill="#c9cfdd"/>
    <rect x="262" y="552" width="300" height="22" rx="11" fill="#dde1eb"/>
    <!-- 程序坞 -->
    <rect x="232" y="770" width="560" height="132" rx="40" fill="#ffffff" fill-opacity="0.36"/>
    <rect x="268" y="798" width="76" height="76" rx="20" fill="#3a7bfd"/>
    <rect x="370" y="798" width="76" height="76" rx="20" fill="#34c759"/>
    <rect x="472" y="798" width="76" height="76" rx="20" fill="#ff9f0a"/>
    <rect x="574" y="798" width="76" height="76" rx="20" fill="#ff375f"/>
    <rect x="676" y="798" width="76" height="76" rx="20" fill="#1d1d2b"/>
    <path d="M696 836 l14 10 l-14 10" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="718" y="852" width="18" height="6" rx="3" fill="#ffffff"/>
  </g>
</svg>
