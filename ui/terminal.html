<!-- 启动不闪白、不闪黑：第一帧就是 App 自己的底色——上次记下的（深、浅各一个；跟随系统时按现在系统是深是浅），界面搭好之前整个藏着，
     搭好了（live.js 恢复完窗口时叫 TSU_BOOT.done()）淡入。底色记在 localStorage 的 tsu-boot，也交给 App 当原生窗口的底色（下次一开窗就是它）。
     放在所有样式表前面：不用等它们下载完就先定下来 -->
<style>
  html.termapp.boot, html.termapp.boot body { background: var(--boot-bg) !important; }
  html.termapp.boot #desktop { opacity: 0; }
  html.termapp.boot-in #desktop { transition: opacity .22s cubic-bezier(.2, 0, 0, 1); }
</style>
<script>
(function () {
  var root = document.documentElement, rec = {};
  try { rec = JSON.parse(localStorage.getItem("tsu-boot") || "{}") || {}; } catch (e) { rec = {}; }
  var sysLight = matchMedia("(prefers-color-scheme: light)").matches, old = localStorage.getItem("tsu-theme");
  var light = rec.mode === "light" || rec.mode === "dark" ? rec.mode === "light" : rec.mode === "auto" || !old ? sysLight : old === "light"; // 没记过：以前记的深浅（tsu-theme），再没有就跟系统
  root.classList.toggle("light", light);
  root.style.setProperty("--boot-bg", rec[light ? "light" : "dark"] || (light ? "#ffffff" : "#000000"));
  // 字号：第一帧就是上次用的（对话、终端、界面），不先按默认的画再换
  var fs0 = +localStorage.getItem("tsu-font") || 12;
  root.style.setProperty("--tsu-fs", fs0 + "px");
  root.style.setProperty("--st-fs", Math.max(10, Math.min(18, fs0 - 1)) + "px");
  root.style.setProperty("--st-fk", String(fs0 / 12));
  root.classList.add("boot");
  var hex = function (c) { var m = /^rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)$/.exec(c || ""); if (!m || (m[4] !== undefined && +m[4] < 0.5)) return null; return "#" + [m[1], m[2], m[3]].map(function (x) { return ("0" + (+x).toString(16)).slice(-2); }).join(""); };
  var lastSent = "", tm = 0, done = false;
  // 记下现在真的在用的底色（设置里正预览着别的风格、配色时不记）：mode = auto（跟随系统）/ dark / light，dark、light 各一个颜色
  function save() {
    if (root.classList.contains("boot")) return;
    var S = window.STUDIO, pv = S && S.previewOf;
    if (pv && ["os", "colorScheme", "claudeTheme"].some(function (k) { return pv(k) !== undefined; })) return;
    var bg = hex(getComputedStyle(root).backgroundColor);
    if (!bg) return;
    var lt = root.classList.contains("light"), r = {};
    try { r = JSON.parse(localStorage.getItem("tsu-boot") || "{}") || {}; } catch (e) { r = {}; }
    var get = function (k) { return S && S.get ? S.get(k, true) : undefined; }, os = get("os") || "vscode", cs = get("colorScheme");
    r.mode = (os === "claude" ? !/^(light|dark)$/.test(get("claudeTheme") || "") : !cs || cs === "auto") ? "auto" : lt ? "light" : "dark";
    r[lt ? "light" : "dark"] = bg;
    var s = JSON.stringify(r);
    if (s !== localStorage.getItem("tsu-boot")) try { localStorage.setItem("tsu-boot", s); } catch (e) { /* 满了 */ }
    var N = window.nadosNative;
    // mode 同 native.js：跟随系统时是 auto（不定死窗口的深浅，不然网页读到的系统深浅也被定死，macOS 换深浅色就没反应了）
    if (N && N.call && s !== lastSent) { lastSent = s; N.call("window.appearance", { mode: r.mode === "auto" ? "auto" : lt ? "light" : "dark", bg: bg, boot: r }).catch(function () {}); }
  }
  new MutationObserver(function () { clearTimeout(tm); tm = setTimeout(save, 400); }).observe(root, { attributes: true, attributeFilter: ["class", "style"] });
  window.TSU_BOOT = {
    // 界面搭好了：再等两帧（排版、画完）淡入
    done: function () {
      if (done) return;
      done = true;
      requestAnimationFrame(function () { requestAnimationFrame(function () {
        root.classList.add("boot-in");
        root.classList.remove("boot");
        root.style.removeProperty("--boot-bg");
        setTimeout(function () { root.classList.remove("boot-in"); save(); }, 300);
      }); });
    },
  };
  setTimeout(function () { window.TSU_BOOT.done(); }, 8000); // 万一没叫到（脚本出错）：也要露出来
})();
</script>

<style>
  /* 整个窗口就是终端（同 iTerm）：桌面的菜单栏、Dock、墙纸都不要；终端窗口铺满，红黄绿用 App 自己的（网页里的藏起来，标题栏左边让出位置）。
     系统风格选 macOS（html.st-macos，macos.js）时反过来：菜单栏、Dock、墙纸都要，编辑区里的每个标签页是桌面上的一个窗口 */
  html.termapp:not(.st-macos), html.termapp:not(.st-macos) body, html.termapp:not(.st-macos) #desktop { background: #000; }
  html.termapp.light:not(.st-macos), html.termapp.light:not(.st-macos) body, html.termapp.light:not(.st-macos) #desktop { background: #fff; }
  html.termapp:not(.st-macos) #menubar, html.termapp:not(.st-macos) #dock, html.termapp #wall, html.termapp:not(.st-macos) #settings { display: none !important; }
  html.termapp:not(.st-macos) #win { position: fixed !important; left: 0 !important; top: 0 !important; width: 100vw !important; height: 100vh !important; transform: none !important; border-radius: 0 !important; box-shadow: none !important; }
  html.termapp:not(.st-macos) #win > .body { border-radius: 0 !important; }
  html.termapp.native-app #win .bar > i { visibility: hidden; }
  html.termapp.native-app #win .bar { padding-left: var(--nados-pad, 78px); }
  /* 滚到顶、到底不回弹（macOS 触控板那种橡皮筋）：设置、列表、对话哪里都不要，停在边上就是停住 */
  html.termapp, html.termapp * { overscroll-behavior: none; }
</style>
